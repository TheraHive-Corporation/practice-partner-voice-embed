<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Practice Partner (Voice)</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100dvh;
  overflow: hidden;
  background: transparent;
}
</style>
</head>
<body>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var character = params.get('character') || 'Nikki';
  var moduleName = params.get('module') || 'Distress Tolerance - TIPP';
  var studentId = params.get('student_id') || '00000000-0000-0000-0000-000000000000';

  var el = document.createElement('elevenlabs-convai');
  el.setAttribute('agent-id', 'agent_5901kzyp45bqe3795c2bmsxmyr6t');
  el.setAttribute('dynamic-variables', JSON.stringify({
    character: character,
    module: moduleName,
    student_id: studentId
  }));
  document.body.appendChild(el);

  var script = document.createElement('script');
  script.src = 'https://unpkg.com/@elevenlabs/convai-widget-embed';
  script.async = true;
  script.type = 'text/javascript';
  document.body.appendChild(script);

  // The ElevenLabs widget has no official "fill container" mode - the
  // "Full" variant renders a fixed 400x550px card anchored to a corner,
  // sized by a stylesheet rule inside its own shadow DOM. Setting inline
  // styles on the elements directly doesn't stick, because the widget's
  // framework re-renders and rewrites the inline "style" attribute on its
  // own, wiping out anything set that way within a fraction of a second.
  // Instead we inject our own <style> element into the shadow root. That's
  // a separate stylesheet the widget's re-renders never touch, and because
  // it's appended after the widget's own <style> tag, our !important rules
  // win the cascade. This targets undocumented internal class names
  // (.overlay / .sheet) and may need updating if a future ElevenLabs
  // widget release renames them.
  function injectFillStyle() {
    var host = document.querySelector('elevenlabs-convai');
    if (!host || !host.shadowRoot) return false;
    if (host.shadowRoot.getElementById('fill-container-style')) return true;

    var style = document.createElement('style');
    style.id = 'fill-container-style';
    style.textContent =
      '.overlay {' +
      '  margin: 0 !important;' +
      '  padding: 0 !important;' +
      '  inset: 0 !important;' +
      '  width: 100% !important;' +
      '  height: 100% !important;' +
      '}' +
      '.sheet {' +
      '  position: static !important;' +
      '  inset: 0 !important;' +
      '  top: 0 !important;' +
      '  left: 0 !important;' +
      '  right: 0 !important;' +
      '  bottom: 0 !important;' +
      '  width: 100% !important;' +
      '  height: 100% !important;' +
      '  max-width: 100% !important;' +
      '  max-height: 100% !important;' +
      '  border-radius: 0 !important;' +
      '  box-shadow: none !important;' +
      '}';
    host.shadowRoot.appendChild(style);
    return true;
  }

  var tries = 0;
  var poll = setInterval(function () {
    tries++;
    if (injectFillStyle() || tries > 150) {
      clearInterval(poll);
    }
  }, 200);
})();
</script>
</body>
</html>
